<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>irish seasonal sky viewer</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A 3D view of the horizon from a given place and time, for watching the sun and moon the way a stone circle would"/>

        <style type="text/css">
            html, body { margin: 0; height: 100%; overflow: hidden; }
            body { font-family: Arial, Helvetica, sans-serif; background: #012; color: #fff; }
            #scene { position: fixed; inset: 0; }
            #scene canvas { display: block; touch-action: none; }

            #observer {
                position: fixed; top: 1rem; left: 1rem;
                max-width: calc(100vw - 2rem); box-sizing: border-box;
                padding: .75rem 1rem; border-radius: 6px;
                background: rgba(0, 17, 34, .75);
            }
            #observer .title { margin: 0 0 .5rem; font-weight: bold; }
            #observer .fields { display: grid; grid-template-columns: auto auto; gap: .4rem .75rem; align-items: center; }
            #observer label { font-size: .85rem; }
            #observer input { font: inherit; font-size: .9rem; width: 9.5rem; padding: .15rem .3rem; box-sizing: border-box; }
            #observer input.invalid { outline: 2px solid #f55; }

            #hud {
                position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
                display: flex; flex-direction: column; align-items: center; gap: .5rem;
                padding: .5rem .75rem .75rem; border-radius: 6px;
                background: rgba(0, 17, 34, .75);
                user-select: none; -webkit-user-select: none;
            }
            #heading { min-width: 11rem; text-align: center; }
            #heading .deg { font-size: 1.2rem; font-weight: bold; }
            #heading .hint { font-size: .75rem; opacity: .75; }
            #heading .touch-hint { display: none; }
            @media (hover: none) and (pointer: coarse) {
                #heading .mouse-hint { display: none; }
                #heading .touch-hint { display: block; }
            }

            #controls {
                display: grid; gap: .3rem;
                grid-template-columns: repeat(3, 3rem); grid-template-rows: repeat(3, 3rem);
                grid-template-areas: ". up ." "left reset right" ". down .";
            }
            #controls button {
                font: inherit; font-size: 1.1rem;
                border: 1px solid #9ab; border-radius: 4px; background: #234; color: #fff;
                touch-action: none;
            }
            #controls button:active { background: #3a5570; }
            #moveForward { grid-area: up; }
            #turnLeft { grid-area: left; }
            #controls #reset { grid-area: reset; font-size: .7rem; }
            #turnRight { grid-area: right; }
            #moveBack { grid-area: down; }
        </style>

        <!-- Three.js is loaded from js/lib/three (r186). to load it from the CDN instead,
             uncomment this block and comment out the local import map below
             (import maps are JSON, which doesn't allow comments inside it, and only one can be active)
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
                }
            }
        </script>
        -->
        <script type="importmap">
            {
                "imports": {
                    "three": "./js/lib/three/three.module.js"
                }
            }
        </script>
    </head>
    <body>

        <div id="scene"></div>

        <form id="observer" autocomplete="off">
            <p class="title">Observer</p>
            <div class="fields">
                <label for="lat">Latitude</label>
                <input id="lat" type="number" step="any" min="-90" max="90" value="53.6947">
                <label for="lon">Longitude</label>
                <input id="lon" type="number" step="any" min="-180" max="180" value="-6.4755">
                <label for="date">Date</label>
                <input id="date" type="date">
                <label for="time">Time (UTC)</label>
                <input id="time" type="time">
            </div>
        </form>

        <div id="hud">
            <div id="heading">
                <div class="deg"></div>
                <div class="hint mouse-hint">&larr; &rarr; turn &middot; &uarr; &darr; move &middot; right-drag to look</div>
                <div class="hint touch-hint">drag the view to look around</div>
            </div>
            <div id="controls">
                <button id="moveForward" type="button" aria-label="Move forward">&#9650;</button>
                <button id="turnLeft" type="button" aria-label="Turn left">&#9664;</button>
                <button id="reset" type="button" aria-label="Reset to the centre, facing south">Reset</button>
                <button id="turnRight" type="button" aria-label="Turn right">&#9654;</button>
                <button id="moveBack" type="button" aria-label="Move back">&#9660;</button>
            </div>
        </div>

        <script type="module" src="js/viewer.js?v=20260924e"></script>

    </body>
</html>
